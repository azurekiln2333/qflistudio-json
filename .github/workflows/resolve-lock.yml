name: Resolve pinned JSON dependency lock
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: qflistudio
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: azurekiln2333/qflistudio-core
          ref: 476a30acee21dc486ee2849dd8064a7be665e4d5
          path: qflistudio-core
          persist-credentials: false
      - name: Install exact upstream Flutter
        shell: bash
        run: |
          git clone --depth 1 --branch 3.50.0 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = ab2912035e160d9cad6306df307576da6128ebdb
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Resolve lock on GitHub only
        working-directory: qflistudio
        shell: bash
        run: |
          flutter config --no-analytics
          flutter pub get
          dart pub deps --json > dependency-graph.json
          printf 'app=%s\ncore=%s\nflutter=%s\n' "$GITHUB_SHA" "$(git -C ../qflistudio-core rev-parse HEAD)" "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" > lock-provenance.txt
          sha256sum pubspec.yaml pubspec.lock dependency-graph.json >> lock-provenance.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: resolved-lock
          path: |
            qflistudio/pubspec.lock
            qflistudio/dependency-graph.json
            qflistudio/lock-provenance.txt
          if-no-files-found: error
          retention-days: 7

