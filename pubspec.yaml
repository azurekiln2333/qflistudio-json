name: qfli_json
description: "QFLIJson：JSON 编辑、校验、格式化与结构预览。"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  qfli_studio_core:
    path: ../qflistudio-core

  path: ^1.9.1

  cupertino_icons: ^1.0.8

dependency_overrides:
  re_editor:
    path: ../qflistudio-core/vendor/re_editor
  xterm:
    path: ../qflistudio-core/vendor/xterm

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png
    - assets/content/
